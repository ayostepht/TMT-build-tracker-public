name: public-ci

# CI for the public hosted-site branch (Postgres). Separate from `docker` and `promote`, which
# serve the self-hosted line and are not triggered by this branch's pull requests unless they
# target their own branches. Nothing here publishes: no image push, no secrets, read-only token.
on:
  push:
    branches: [claude/elegant-fermi-ea7mci]
  pull_request:
    branches: [claude/elegant-fermi-ea7mci]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: check, lint, unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tmt
          POSTGRES_PASSWORD: tmt
          POSTGRES_DB: tmt_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tmt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The unit-test harness creates and drops one database per test file on this server.
      TEST_DATABASE_URL: postgres://tmt:tmt@localhost:5432/tmt_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tmt
          POSTGRES_PASSWORD: tmt
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tmt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # playwright.config.ts starts the built app against `tmt_e2e`, which e2e/reset-db.mjs
      # drops and recreates before every run (it refuses names that do not end in _e2e).
      E2E_DATABASE_URL: postgres://tmt:tmt@localhost:5432/tmt_e2e
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install chromium
        if: steps.pwcache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pwcache.outputs.cache-hit == 'true'
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    name: docker build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      # push: false and load: false, so nothing leaves the runner. The kit pack is downloaded
      # from the public release and verified against kitpacks/index.json; the build fails if it
      # cannot be (no KITPACK_OPTIONAL here: the shipped image must contain it).
      - run: docker buildx build --pull --tag tmt-build-tracker:ci .
