name: public-ci

# CI for the hosted TMT Build Tracker (Postgres). Pull requests never publish: the read-only token
# is the default and only the `publish` job (a push to main, after every test job) gets
# `packages: write`. It pushes ghcr.io/ayostepht/tmt-build-tracker-public with the tags `latest`
# and `sha-<short sha>`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: check, lint, unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tmt
          POSTGRES_PASSWORD: tmt
          POSTGRES_DB: tmt_test
          # Safety margin for parallel test workers (default 100); initdb writes it to postgresql.conf.
          POSTGRES_INITDB_ARGS: '-c max_connections=300'
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tmt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The unit-test harness creates and drops one database per test file on this server.
      TEST_DATABASE_URL: postgres://tmt:tmt@localhost:5432/tmt_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tmt
          POSTGRES_PASSWORD: tmt
          POSTGRES_DB: postgres
          POSTGRES_INITDB_ARGS: '-c max_connections=300'
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tmt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # playwright.config.ts starts the built app against `tmt_e2e`, which e2e/reset-db.mjs
      # drops and recreates before every run (it refuses names that do not end in _e2e).
      E2E_DATABASE_URL: postgres://tmt:tmt@localhost:5432/tmt_e2e
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install chromium
        if: steps.pwcache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pwcache.outputs.cache-hit == 'true'
      - run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    name: docker build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      # push: false and load: false, so nothing leaves the runner. The kit pack is downloaded
      # from the public release and verified against kitpacks/index.json; the build fails if it
      # cannot be (no KITPACK_OPTIONAL here: the shipped image must contain it).
      - run: docker buildx build --pull --tag tmt-build-tracker:ci .

  publish:
    name: publish image (public tag)
    # Never on pull requests; only a push to the hosted-site branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, e2e, image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    concurrency:
      group: public-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # linux/amd64 only (Unraid), like the `image` job above, which builds a single platform.
      # The kit pack comes from the public release exactly as in `image` (no secret, no
      # KITPACK_OPTIONAL: the build fails if the pack cannot be fetched and verified).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ghcr.io/ayostepht/tmt-build-tracker-public:latest
            ghcr.io/ayostepht/tmt-build-tracker-public:sha-${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=TMT Build Tracker, hosted version
