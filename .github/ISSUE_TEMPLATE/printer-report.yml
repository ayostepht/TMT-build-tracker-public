name: Printer connection report
description: Tell us how a printer connection worked (or did not) for you.
title: 'Printer report: '
labels: ['printer-report']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying a printer connection. Reports on Klipper and OctoPrint through OctoEverywhere (marked Experimental in the app) are especially useful, and a report that says "it all worked" helps as much as a problem.

        **Never paste an OctoEverywhere link, API key, access code or serial number.** Mask IP addresses if you prefer.
  - type: input
    id: printer
    attributes:
      label: Printer make and model
      placeholder: Elegoo Centauri Carbon, Voron 2.4, Prusa MK4 with OctoPrint
    validations:
      required: true
  - type: input
    id: printer-software
    attributes:
      label: Firmware or software version
      description: Elegoo firmware, Klipper and Moonraker versions, or OctoPrint version, plus the OctoEverywhere plugin version if you know it.
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection option used
      description: The option you chose under Add a printer on the Integrations page.
      options:
        - OctoEverywhere link (Elegoo)
        - OctoEverywhere link (Klipper)
        - OctoEverywhere link (OctoPrint)
        - Not connected
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where the app runs
      options:
        - The public site
        - My own deployment of this repository
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: On the About page, or the version in /api/health.
    validations:
      required: true
  - type: checkboxes
    id: worked
    attributes:
      label: What worked
      description: Tick everything that worked.
      options:
        - label: It connects
        - label: Live status
        - label: Progress and time left
        - label: Camera
        - label: A print linked to a plate
        - label: Automatic logging
  - type: textarea
    id: problems
    attributes:
      label: What did not work, and what you saw
      description: What you expected, what happened, and any message on screen.
  - type: textarea
    id: logs
    attributes:
      label: Relevant container log lines (own deployments only)
      description: Lines from the container log that start with `[tmt]`. Remove anything private first, above all the OctoEverywhere link.
      render: text
