name: Bug report
description: Something in the app does not work as it should.
title: 'Bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for the hosted edition (the public site, or your own hosted deployment of this repository). For the self-hosted edition (SQLite, Unraid, LAN printers), use https://github.com/ayostepht/TMT-Build-Tracker/issues instead.

        Please do not paste access codes, API keys, shared links or secrets. For a security problem, do not open an issue: see SECURITY.md.
  - type: textarea
    id: did
    attributes:
      label: What you did
      description: The steps, starting from a page of the app.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: On the About page, or the version in /api/health.
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Where you use it
      description: The public site, or your own deployment (Fly.io, Railway, your own server with a Cloudflare Tunnel or another proxy).
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari on iPhone 15, Chrome on Windows
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images into this box. Hide anything private.
