name: Hosting or docs feedback
description: A guide was unclear, or you got stuck deploying the hosted edition.
title: 'Docs: '
labels: ['documentation']
body:
  - type: input
    id: guide
    attributes:
      label: Which guide
      placeholder: Hosting guide (Supabase, sign-in apps, Fly.io, Railway, Cloudflare Tunnel), Printers
    validations:
      required: true
  - type: textarea
    id: stuck
    attributes:
      label: Where you got stuck
      description: The step, and what you saw. Remove secrets from any log lines.
    validations:
      required: true
  - type: textarea
    id: help
    attributes:
      label: What would have helped
  - type: input
    id: setup
    attributes:
      label: Where you deployed
      placeholder: Fly.io, Railway, Docker with a Cloudflare Tunnel, Unraid
