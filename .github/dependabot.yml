version: 2
updates:
  # Pull requests target `main` (the deployed branch), like every other pull request; they are
  # merged only after review because a merge into `main` publishes the image the site runs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The project runs Node 22; the types must match the runtime major.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 upgrade is deferred until after 1.0. Remove this entry when the upgrade
      # is scheduled.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
